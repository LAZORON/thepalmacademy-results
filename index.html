<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Palm Academy — Results Not Found</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #eef4f0 0%, #dce8e0 100%);
      color: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      max-width: 480px;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(15, 61, 46, 0.14);
      text-align: center;
      border: 1px solid #d1e0d7;
    }
    .top-banner {
      height: 8px;
      background: linear-gradient(90deg, #0f5132, #d4af37, #198754, #0f5132);
      background-size: 200% 100%;
      animation: shimmer 4s linear infinite;
    }
    @keyframes shimmer {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
    .header {
      background: #0f5132;
      color: #ffffff;
      padding: 26px 20px 22px;
    }
    .badge {
      width: 56px;
      height: 56px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: #ffffff;
      color: #0f5132;
      font-weight: 800;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #d4af37;
      letter-spacing: 0.5px;
    }
    .school-name {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
    .subtitle {
      margin: 5px 0 0;
      font-size: 0.9rem;
      color: #d1fae5;
    }
    .body-content {
      padding: 30px 24px 32px;
    }
    .notice-title {
      margin: 0 0 12px;
      font-size: 1.3rem;
      font-weight: 700;
      color: #b91c1c;
    }
    .notice-text {
      margin: 0 auto 22px;
      font-size: 1.05rem;
      line-height: 1.6;
      color: #334155;
      max-width: 360px;
    }
    .pill {
      display: inline-block;
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #f59e0b;
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .footer {
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      padding: 12px 16px;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="top-banner"></div>
    <div class="header">
      <div class="badge">PARS</div>
      <h1 class="school-name">The Palm Academy</h1>
      <p class="subtitle">Student's Examination Results Portal</p>
    </div>
    <div class="body-content">
      <h2 class="notice-title">Results are not yet </h2>
      <p class="notice-text">Results are not available; please visit on Thursday, November 26, 2026..</p>
      <div class="pill">Portal will be open: Thursday</div>
    </div>
    <div class="footer">
    <p>&copy; 2026 The Palm Academy | Academic Committee. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
